services:
  - type: web
    name: eventicate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /health
    envFromFile: .env.render
    disk:
      name: eventicate-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
