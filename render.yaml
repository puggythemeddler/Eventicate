# NOTE ON SECRETS
# Sensitive values (DATABASE_URL*, JWT_SECRET, CLOUDINARY_*) are managed in the
# Render dashboard (Settings -> Environment) and marked `sync: false` here so
# they are never committed to git. If you clone this repo fresh, set them in
# the dashboard before first deploy. Rotate the JWT_SECRET and the Cloudinary
# credentials if this file ever leaked.
services:
  - type: web
    name: eventicate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && node scripts/migrate-retry.mjs && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: https://eventicate.vercel.app
      - key: NEXT_PUBLIC_APP_URL
        value: https://eventicate.vercel.app
      - key: PORT
        value: "3001"
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://eventicate.vercel.app,http://localhost:3000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://eventicate.vercel.app/api/auth/google/callback
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: LOCAL_SYNC_ENABLED
        value: "false"
      - key: LOCAL_SYNC_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: u1ucoiox
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
