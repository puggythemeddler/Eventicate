name: Keep API awake

on:
  schedule:
    # Render (free tier) sleeps after ~15 min of inactivity and Neon (free DB)
    # pauses after ~5 min. This hits a public endpoint that runs a real DB query
    # so both stay warm and button clicks stay fast.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    steps:
      - name: Wake API + DB
        run: |
          curl -sf --max-time 90 https://eventicate-api.onrender.com/api/locations/public > /dev/null